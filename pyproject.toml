[project]
name = "loongcli"
version = "0.1.0"
description = "loongcli — 通用 AI Agent 运行时"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "mcp>=1.0.0,<2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.1,<1.0.0",
]

[project.optional-dependencies]
# Alt+V 从剪贴板贴截图（loongcli/tui/clipboard_image.py）；不装也能用，按 Alt+V 时提示安装
clipboard = ["pillow>=10.0"]

[project.scripts]
loongcli = "loongcli.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# 只打 loongcli 包：不限定时 tests/、docs/ 等目录也会被当成顶层包装进 site-packages
include = ["loongcli*"]

[tool.setuptools.package-data]
# Web UI 静态资源：不声明时非 editable 安装缺这几个文件，/web 打不开
loongcli = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
